# The 368 tests are only worth something if they run without being remembered.
#
# Actions are pinned to commit SHAs rather than tags, for the same reason
# desktop/package.json pins its toolchain exactly: a moving tag on a workflow that
# builds a password manager is a supply-chain hole, and `v5` is a mutable pointer.
# Comments carry the human-readable version so upgrades stay reviewable.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Nothing here needs to write to the repo, and a workflow
# on a password manager should not hold a token that could.
permissions:
  contents: read

# A superseded push does not need to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # Both versions report, so a failure on one is not hidden by the other.
      fail-fast: false
      matrix:
        # 22.x is the floor package.json declares; 24.x is what development happens on.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci`, not `install`: the lockfile decides, and a workflow that silently
      # resolves a different dependency tree than the developer has is not a check.
      - run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Tests (core + extension + server)
        run: npm test

      # Cheap, and it is the claim the README leads with: real Argon2id + AES-GCM
      # end to end, including tamper cases that must be REJECTED.
      - name: End-to-end crypto proof
        run: npm run demo

      # This build validates its own output — manifest correctness, no <all_urls>,
      # CSP pinned to 'self', wasm-unsafe-eval present, content script ESM-free and
      # under 25 KB — then boots the service worker and checks a content-script
      # sender is rejected. It is a security test wearing a build's clothes.
      - name: Build extension (self-validating)
        run: npm run build:extension

      - name: Build renderer (what desktop/ packages)
        run: npm run build --workspace @keyhole/app

      # The README promises zero advisories in what actually ships. Assert it,
      # so the next dependency cannot quietly make that sentence untrue.
      - name: Production dependencies have no known advisories
        run: npm audit --omit=dev

  ios:
    # The Swift port of the core is a documented line-for-line copy of core/src.
    # It cannot be built on the Windows machine this is developed on, so without
    # this job its tests are written and never run — which is how the port drifts
    # from the TypeScript it promises to match.
    name: ios (swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Swift version
        run: swift --version
      - name: KeyholeCore tests
        run: swift test
        working-directory: ios

# Deliberately NOT here: packaging the portable .exe. electron-builder is slow,
# and publishing an unsigned password-manager binary from CI would create exactly
# the artifact users should not download from an untrusted place. Releases stay a
# deliberate local act until there is code signing.
