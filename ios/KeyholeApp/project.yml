name: Keyhole
options:
  bundleIdPrefix: app.keyhole
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  postGenCommand: python3 scripts/fix-local-package-backlinks.py
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.9"
packages:
  Keyhole:
    path: ..
targets:
  KeyholeApp:
    type: application
    platform: iOS
    sources:
      - path: KeyholeApp
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.keyhole.vault
      INFOPLIST_FILE: KeyholeApp/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
      CODE_SIGN_ENTITLEMENTS: KeyholeApp/KeyholeApp.entitlements
    entitlements:
      path: KeyholeApp/KeyholeApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.keyhole.vault
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.app.keyhole.vault
        com.apple.developer.authentication-services.autofill-credential-provider: true
    dependencies:
      - package: Keyhole
        product: KeyholeCore
      - target: KeyholeAutoFill
        embed: true
    info:
      path: KeyholeApp/Info.plist
      properties:
        CFBundleDisplayName: Keyhole
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        LSApplicationQueriesSchemes:
          - settings-navigation
          - App-prefs
          - prefs
        NSFaceIDUsageDescription: Keyhole uses Face ID to unlock your vault without typing your master password. Your master password stays in the device Keychain and is only released after a successful Face ID check.

  KeyholeAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyholeAutoFill
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.keyhole.vault.AutoFill
      INFOPLIST_FILE: KeyholeAutoFill/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: false
      CODE_SIGN_ENTITLEMENTS: KeyholeAutoFill/KeyholeAutoFill.entitlements
      SKIP_INSTALL: true
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: KeyholeAutoFill/KeyholeAutoFill.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.keyhole.vault
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.app.keyhole.vault
        com.apple.developer.authentication-services.autofill-credential-provider: true
    dependencies:
      - package: Keyhole
        product: KeyholeCore
    info:
      path: KeyholeAutoFill/Info.plist
      properties:
        CFBundleDisplayName: Keyhole AutoFill
        NSFaceIDUsageDescription: Keyhole uses Face ID to unlock your vault for AutoFill without typing your master password.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
schemes:
  KeyholeApp:
    build:
      targets:
        KeyholeApp: all
        KeyholeAutoFill: [build]
