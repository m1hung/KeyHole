# Run from the repository root:
#   docker compose -f server/docker-compose.yml up -d
#
# TLS IS NOT OPTIONAL. The auth secret travels in an Authorization header, so
# put this behind a reverse proxy that terminates HTTPS (Caddy, Traefik,
# nginx). The vault payload is encrypted either way, but plaintext HTTP hands
# an eavesdropper your sync credential.
#
# The "tls" profile below is that proxy, ready to run:
#   KEYHOLE_DOMAIN=sync.example.com \
#     docker compose -f server/docker-compose.yml --profile tls up -d
#
# Caddy obtains and renews the certificate itself; ports 80 and 443 must reach
# it and KEYHOLE_DOMAIN must already resolve here. See ./Caddyfile for the
# LAN-only variant.

services:
  keyhole-sync:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: keyhole-sync:latest
    restart: unless-stopped
    # Bound to loopback: expose it through your reverse proxy, not directly.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - keyhole-data:/data
    environment:
      KEYHOLE_DB: /data/keyhole.sqlite
      # Interpolated from your shell, NOT hardcoded — a literal value here would
      # silently win over `KEYHOLE_ALLOW_REGISTRATION=false docker compose up -d`
      # and leave registration open on a host you believed you had closed.
      # Open by default so a fresh deploy is usable; close it once your own
      # devices are enrolled.
      KEYHOLE_ALLOW_REGISTRATION: "${KEYHOLE_ALLOW_REGISTRATION:-true}"

  # Only started with `--profile tls`. Without it, `up -d` behaves exactly as
  # before: sync server on loopback, no proxy, no ports 80/443 claimed.
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # `${VAR:?err}` would be the obvious choice here, but Compose interpolates
      # the whole file before profiles decide what runs — so a required variable
      # on this service makes plain `up -d` fail for people who never asked for
      # Caddy (the Tailscale and reverse-proxy-elsewhere setups).
      #
      # A reserved .invalid default keeps that path working while still failing
      # loudly if you start this profile without setting the domain: the name
      # cannot resolve, so certificate issuance fails and says so in
      # `docker compose logs caddy`.
      KEYHOLE_DOMAIN: ${KEYHOLE_DOMAIN:-keyhole.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account keys. Losing this volume means re-issuing on
      # every restart, which will hit Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - keyhole-sync

volumes:
  keyhole-data:
  caddy-data:
  caddy-config:
